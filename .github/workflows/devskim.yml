name: devskim
on:
  push: null
  pull_request: null
permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: write
jobs:
  devskim:
    name: devskim
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: analysis
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16
        with:
          # Keep the action defaults; skip generated lockfiles and Workers runtime types, whose
          # integrity hashes and API surface trip DevSkim rules such as DS126858 (weak hash).
          ignore-globs: "**/.git/**,**/bin/**,**/pnpm-lock.yaml,**/package-lock.json,**/bun.lock,**/Cargo.lock,**/uv.lock,**/Gemfile.lock,**/go.sum,**/worker-configuration.d.ts"
      - name: upload
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: devskim-results.sarif
