name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
jobs:
  claude-review:
    # Fork PRs get no secrets and the action refuses actors without write
    # access, so they would only ever produce a failed run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # The action only accepts a marketplace as a bare .git URL (no ref) or a
      # local path, so check the marketplace out at a pinned commit instead.
      - name: Checkout pinned plugin marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-code
          ref: 2301018b1f61073c501a8e7a4813ef48c239163b
          path: .claude-code-marketplace
          fetch-depth: 1
          persist-credentials: false
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ github.workspace }}/.claude-code-marketplace
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: --allowedTools mcp__github_inline_comment__create_inline_comment
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
